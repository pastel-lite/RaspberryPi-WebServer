<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED 제어</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container text-center mt-5">
        <h2>LED ON / OFF</h2>
        <div>
            <img id="led" src="/static/off.png" width="100" alt="led">
        </div>
        <input class="btn btn-primary" id="on" type="button" value="ON">
        <input class="btn btn-success" id="off" type="button" value="OFF">
    </div>
    {% if logs %}
    <ul class="list-group">
        {% for log in logs %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ log.created_at }}</span>
            <span>{{ log.pin }}</span>
            <span>{% if log.is_on %}LED 켬{% else %}LED 끔{% endif %} </span>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p class="text-muted">기록이 존재하지 않습니다.</p>
    {% endif %}
    <script src="/static/index.js"></script>
</body>
</html>
