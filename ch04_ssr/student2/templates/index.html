<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker</title>
</head>

<style>
    .Title{
        font-family: Georgia, 'Times New Roman', Times, serif;
        font-size: 50px;
        font-weight: normal;
        text-align: center;
    }
    .number{
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-size: 60px;
        font-weight: 700;
        text-align: center;
    }
    .btnclass{
        margin-left: auto;
        margin-right: auto;
        display: flex;
        justify-content: center;
        gap: 10px;
    }
    .btn-1{
        color: white;
        background-color: blue;
        width: 100px;
        height: 40px;
        border-radius: 15px;
        border: 0;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-size: 20px;
    }
    .btn-2{
        color: white;
        background-color: green;
        border-radius: 15px;
        border: 0;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        font-size: 20px;
    }
</style>

<body>
    <h2 class="Title">Click si sutja jungga</h2>
    
    <h1 class="number" id="num">0</h1>

    <div class="btnclass">
        <button id="increase" class="btn-1">Su jungga</button>
        <button id="submit" class="btn-2">Jeonsong</button>
    </div>
    <script src="{{ url_for('static', filename='index.js') }}"></script>
</body>
</html>
